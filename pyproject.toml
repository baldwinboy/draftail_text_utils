[project]
name = "draftail-text-utils"
version = "0.3.1"
description = "Extends Draftail's text customization"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
authors = [
  { name = "baldwinboy" },
]
keywords = ["draftail", "font family", "font size", "highlight", "rich text", "text alignment", "text color", "wagtail"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Wagtail",
  "Framework :: Wagtail :: 8",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "Django>=6.0,<6.1",
  "Wagtail>=8.0,<8.1",
  "cssutils>=2.15.0,<3",
  "wagtail-traverse>=1.0.1",
]

[project.urls]
Changelog = "https://github.com/baldwinboy/draftail_text_utils/blob/main/CHANGELOG.md"
Documentation = "https://github.com/baldwinboy/draftail_text_utils/tree/main/docs"
Homepage = "https://github.com/baldwinboy/draftail_text_utils"
Issues = "https://github.com/baldwinboy/draftail_text_utils/issues"
Repository = "https://github.com/baldwinboy/draftail_text_utils"

[dependency-groups]
dev = [
  "dj-database-url==3.1.2",
  "pre-commit==4.6.2",
  "prek==0.5.5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "draftail_text_utils"
source-exclude = [
  "draftail_text_utils/static_src",
  "draftail_text_utils/test",
  "testmanage.py",
  ".*",
  "*.ini",
  "*.yml",
]

[tool.uv.build-backend.package-data]
"draftail_text_utils/static/**" = ["*"]
"draftail_text_utils/templates/**" = ["*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "draftail_text_utils.test.settings"
